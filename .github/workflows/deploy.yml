name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sostituisci il placeholder con la chiave Serper
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: sed -i "s|const SERPER_API_KEY = '__SERPER_API_KEY__';|const SERPER_API_KEY = '${SERPER_API_KEY}';|" index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
