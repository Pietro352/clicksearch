name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sostituisci il placeholder con la chiave Tavily
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: sed -i "s|const TAVILY_API_KEY = '__TAVILY_API_KEY__';|const TAVILY_API_KEY = '${TAVILY_API_KEY}';|" index.html

      - name: Sostituisci il placeholder con la chiave Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: sed -i "s|const PEXELS_API_KEY = '__PEXELS_API_KEY__';|const PEXELS_API_KEY = '${PEXELS_API_KEY}';|" index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
